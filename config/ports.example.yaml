ports:
  ssh: {port: 22, protocol: tcp, enabled: true}
  https: {port: 443, protocol: tcp, enabled: false}
  api: {port: 8000, protocol: tcp, bind: 127.0.0.1}
  console_1:
    physical_port: USB-A 2.0 · Console 1
    usb_path: "1-1.3"
    tcp_port: 2001
    enabled: false
  console_2:
    physical_port: USB-A 2.0 · Console 2
    usb_path: "1-1.4"
    tcp_port: 2002
    enabled: false
  service_usb:
    physical_port: USB-A 3.0 · Service
    usb_path: "1-1.1 / 2-1"
    enabled: true
  expansion_usb:
    physical_port: USB-A 3.0 · Storage
    usb_path: "1-1.2 / 2-2"
    enabled: true
  kvm_otg:
    physical_port: USB-C OTG · Device
    mode: device
    enabled: false
