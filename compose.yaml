version: "3.7"

services:
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    container_name: kronoskvm-guacd
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/opt/guacamole/sbin/guacd"]
    command: ["-f", "-b", "127.0.0.1", "-l", "4822", "-L", "warning"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    image: kronoskvm-api:${KRONOSKVM_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: kronoskvm-api
    network_mode: host
    hostname: ${KRONOSKVM_HOSTNAME:-kdx-infrabox}
    restart: unless-stopped
    read_only: true
    user: "10001:20"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /sys:/sys:ro
      - /sys/firmware/devicetree/base:/run/kronoskvm/device-tree:ro
      - /etc/kronoskvm:/etc/kronoskvm:ro
      - /mnt/kronoskvm-storage:/storage
      - /mnt/kronoskvm-external:/external:ro,rslave
      - /var/lib/kronoskvm/state:/state
      - /var/log/kronoskvm:/logs
    environment:
      KRONOSKVM_STORAGE_PATH: /storage
      KRONOSKVM_STORAGE_REQUIRE_MARKER: "0"
      KRONOSKVM_STORAGE_CAPACITY_BYTES: "34359738368"
      KRONOSKVM_STORAGE_RESERVE_BYTES: "10737418240"
      KRONOSKVM_STORAGE_POOL_ID: internal
      KRONOSKVM_STORAGE_LABEL: "Internal SD · 32G"
      KRONOSKVM_STORAGE_TYPE: internal
      KRONOSKVM_STATE_PATH: /state
      KRONOSKVM_LOG_PATH: /logs/application.jsonl
      KRONOSKVM_LOG_MAX_BYTES: "10485760"
      KRONOSKVM_LOG_BACKUP_COUNT: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: kronoskvm-web:${KRONOSKVM_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: kronoskvm-web
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    volumes:
      - /etc/kronoskvm/tls:/etc/nginx/tls:ro
