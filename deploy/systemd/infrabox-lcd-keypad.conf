# Drop-in: /etc/systemd/system/infrabox-lcd.service.d/keypad.conf
# Uses the existing /opt/infrabox-lcd/lib driver and its installed dependencies.
[Unit]
After=local-fs.target systemd-modules-load.service
ConditionPathExists=/etc/kronoskvm/lcd.enabled
ConditionPathExists=/opt/infrabox-lcd/lib/LCD_1inch8.py
ConditionPathExists=/dev/spidev0.0

[Service]
Type=simple
Restart=no
TimeoutStartSec=10
ExecStart=
ExecStart=/usr/bin/python3 /opt/kronoskvm/scripts/keypad-panel.py --lcd
Environment=PYTHONUNBUFFERED=1
